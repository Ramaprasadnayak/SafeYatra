name: safeyatra
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.18.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  jwt_decoder: ^2.0.1
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  syncfusion_flutter_gauges: ^34.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"